type Company {
  id: ID!
  orgId: ID!
  name: String!
  description: String
  isActive: Boolean!
  isCoreBranch: Boolean
  createdAt: String!
}

input CompanyInput {
  name: String!
  description: String
  isActive: Boolean
  isCoreBranch: Boolean
}

extend type Query {
  companies: [Company!]!
  company(id: ID!): Company!
}

extend type Mutation {
  createCompany(input: CompanyInput!): Company!
  updateCompany(id: ID!, input: CompanyInput!): Company!
  deleteCompany(id: ID!): Boolean!
}
