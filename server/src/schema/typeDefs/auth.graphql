type Organization {
  id: ID!
  name: String!
  slug: String!
  plan: String!
  createdAt: String!
  updatedAt: String!
}

type User {
  id: ID!
  orgId: ID!
  name: String!
  email: String!
  role: String!
  isEmailVerified: Boolean!
  lastLogin: String
  avatarUrl: String
  authProvider: String
  createdAt: String!
  accessScope: String
  modules: [String!]!
  companyIds: [ID!]!
  canDeleteExpenses: Boolean!
  canDeleteIncome: Boolean!
}

type AuthPayload {
  token: String!
  user: User!
  org: Organization!
  message: String
}

input RegisterInput {
  name: String!
  email: String!
  password: String!
  orgName: String!
}

input FirebaseOAuthInput {
  idToken: String
  uid: String
  email: String!
  name: String
  avatarUrl: String
  orgName: String
}

type EmailResult {
  success: Boolean!
  message: String!
  messageId: String
}

type ActivityLogEntry {
  id: ID!
  action: String!
  entityType: String
  description: String!
  companyName: String
  createdAt: String!
}

type Query {
  me: User!
  checkEmailExists(email: String!): Boolean!
  myActivityLogs(limit: Int): [ActivityLogEntry!]!
}

type Mutation {
  register(input: RegisterInput!): AuthPayload!
  login(email: String!, password: String!): AuthPayload!
  firebaseOAuth(input: FirebaseOAuthInput!): AuthPayload!
  sendTestEmail(email: String!): EmailResult!
  requestPasswordReset(email: String!): EmailResult!
  resetPassword(token: String!, password: String!): EmailResult!
}
